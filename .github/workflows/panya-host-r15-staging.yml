name: PANYA R15 Windows Native Read-Only Probe (Staging Only)

on:
  push:
    branches:
      - 'panya/host-recovery-r15-native-probe-staging-20261025'
    paths:
      - 'tests/panya-r15/**'
      - '.github/workflows/panya-host-r15-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-process-probe-isolated:
    if: github.repository == 'VAGOO1/lnwjud' && github.ref == 'refs/heads/panya/host-recovery-r15-native-probe-staging-20261025'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout staging code only without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned .NET 8 channel
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Native read-only API self-test on GitHub Windows runner (not PANYA-HOME)
        shell: pwsh
        run: dotnet run --project tests/panya-r15/Panya.R15.NativeProbe.csproj -c Release -- --self-test
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate staged historical evidence fail-closed contracts
        shell: pwsh
        run: node --test tests/panya-r12/stale-recovery-plan.test.mts tests/panya-r13/manifest-preflight.test.mts tests/panya-r15/evidence-contract.test.mts
      - name: Confirm boundary
        shell: pwsh
        run: Write-Output 'R15_STAGING_ONLY_NO_PANYA_HOME_HOST_ACCESS_NO_RELEASE'
